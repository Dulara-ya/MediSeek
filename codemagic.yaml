workflows:
  react-native-ios-android:
    name: React Native Starter Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      java: 17
      vars:
        XCODE_WORKSPACE: "Mediseek.xcworkspace"
        XCODE_SCHEME: "Mediseek"
    
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease 

      - name: Build iOS Unsigned App
        script: |
          cd ios
          xcodebuild build -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release CODE_SIGNING_ALLOWED=NO -sdk iphoneos

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      
    publishing:
      # You can configure email notifications for build statuses here
      email:
        recipients:
          - dularasandamal2@gmail.com
        notify:
          success: true
          failure: true
