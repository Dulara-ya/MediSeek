workflows:
  web-build-workflow:
    name: Build React Vite Web App
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
          
      - name: Build web project
        script: |
          npm run build
          
    artifacts:
      - dist/ # This is the standard output directory for Vite
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease 

      - name: Build iOS Unsigned App
        script: |
          cd ios
          xcodebuild build -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release CODE_SIGNING_ALLOWED=NO -sdk iphoneos

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      
    publishing:
      email:
        recipients:
          - dularasandamal2@gmail.com
        notify:
          success: true
          failure: true
